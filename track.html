<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>تتبع طلبك | جزارة ومطعم أبوهاشم</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#131313;--line:#2b2b2b;--tx:#f5f3ee;--mut:#a9a69d;--gold:#d9a93f;--red:#b5121b;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:400 17px/1.7 Tajawal,Tahoma,sans-serif;display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
h1{font-family:'El Messiri',Tajawal,serif;font-size:clamp(26px,6vw,34px);color:var(--gold);margin:0 0 6px;line-height:1.3}
button,input{font:inherit;color:inherit}
.box{width:min(520px,100%);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:26px;display:grid;gap:16px}
.logo{width:110px;margin:0 auto}
.mut{color:var(--mut);margin:0}
label{display:grid;gap:4px;font-size:15px;color:var(--mut)}
input{background:#000;border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.btn{background:var(--red);color:#fff;font-weight:700;border:0;border-radius:8px;padding:12px 30px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn:disabled{background:#333;color:var(--mut);cursor:default}
.err{color:#ff7b72;font-size:15px;min-height:1.2em;margin:0}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:0}
.steps li{position:relative;padding:6px 38px 14px 0;color:var(--mut)}
.steps li::before{content:"";position:absolute;right:0;top:9px;width:16px;height:16px;border-radius:50%;border:2px solid var(--line);background:#000}
.steps li::after{content:"";position:absolute;right:7px;top:28px;bottom:-4px;width:2px;background:var(--line)}
.steps li:last-child::after{display:none}
.steps li.done{color:var(--tx)}
.steps li.done::before{background:var(--gold);border-color:var(--gold)}
.steps li.done::after{background:var(--gold)}
.steps li.now{color:var(--gold);font-weight:700}
.l{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:4px 0}
.cx{background:#2a0f0f;border:1px solid #ff7b72;border-radius:8px;padding:12px 14px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<main class="box" id="box">
<img class="logo" src="img/logo.png" alt="شعار جزارة ومطعم أبوهاشم">
<div><h1>تتبع طلبك</h1><p class="mut">اكتب رقم الطلب ورقم الموبايل اللي طلبت بيه.</p></div>
<form id="f" style="display:grid;gap:12px">
<label>رقم الطلب<input id="n" dir="ltr" autocomplete="off" required></label>
<label>رقم الموبايل<input id="p" type="tel" dir="ltr" inputmode="tel" autocomplete="tel" required></label>
<p class="err" id="e"></p>
<button class="btn" type="submit">عرض حالة الطلب</button>
</form>
<div id="r"></div>
<p class="mut"><a href="./" style="color:var(--gold)">الرجوع للمتجر</a></p>
</main>
<script>
const SB='https://nukvajplbogqotysuizw.supabase.co',KEY='sb_publishable_6jV5X7mAMDJZ2ZKvtwg4Lw_udf40jyv',WA='201110684337';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STEPS=[['new','تم استلام الطلب'],['confirmed','تم تأكيد الطلب'],['preparing','قيد التجهيز'],['out','خرج للتوصيل'],['delivered','تم التسليم']];
const idx=s=>s=='review'?0:STEPS.findIndex(x=>x[0]==s);
const FR={.25:'ربع',.5:'نص',.75:'تلات أرباع'};
const qty=(q,u)=>{q=+q;if(u=='piece')return q+' قطعة';const a=Math.floor(q),f=+(q-a).toFixed(2);if(!a)return(FR[f]||f)+' كيلو';if(!f)return a==1?'كيلو':a==2?'كيلوين':a+' كيلو';return(a==1?'كيلو':a+' كيلو')+' و'+(FR[f]||f)};
const rpc=async(fn,body)=>{
  const r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.message||'حدث خطأ، حاول تاني.');
  return j;
};
function show(o){
  const cx=o.status=='cancelled',i=idx(o.status);
  const fee=+o.delivery_fee>0?`<div class="l"><span>مصاريف التوصيل</span><span>${esc(o.delivery_fee)} ج</span></div>`:'<p class="mut">مصاريف التوصيل بتتأكد معاك على واتساب.</p>';
  $('r').innerHTML=`<h1 style="font-size:24px">طلب ${esc(o.order_number)}</h1>`+
  (cx?'<div class="cx">تم إلغاء هذا الطلب. لو محتاج مساعدة كلمنا على واتساب.</div>':
  '<ol class="steps">'+STEPS.map((s,k)=>`<li class="${k<i?'done':k==i?'done now':''}">${s[1]}${k==i?' ✓':''}</li>`).join('')+'</ol>')+
  '<div>'+(o.items||[]).map(x=>`<div class="l"><span>${esc(x.name)} × ${qty(x.kg,x.unit)}</span><span>${esc(x.total)} ج</span></div>`).join('')+fee+
  `<div class="l"><b>الإجمالي</b><b style="color:var(--gold)">${esc(o.total)} ج</b></div></div>`+
  `<a class="btn" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${encodeURIComponent('بخصوص طلبي رقم '+o.order_number)}">كلمنا على واتساب</a>`;
}
$('f').onsubmit=async ev=>{
  ev.preventDefault();$('e').textContent='';$('r').innerHTML='';
  const b=ev.submitter;b.disabled=true;
  try{
    const o=await rpc('track_order',{p_order_number:$('n').value.trim(),p_phone:$('p').value.trim()});
    if(!o.found)$('e').textContent='مفيش طلب بالبيانات دي. اتأكد من رقم الطلب والموبايل.';
    else show(o);
  }catch(x){$('e').textContent=x.message}
  b.disabled=false;
};
const q=new URLSearchParams(location.search).get('n');if(q)$('n').value=q;
</script>
</body>
</html>
