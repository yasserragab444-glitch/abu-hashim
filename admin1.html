<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة إدارة جزارة ومطعم أبوهاشم</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#131313;--line:#2b2b2b;--tx:#f5f3ee;--mut:#a9a69d;--gold:#f6b800;--fire:#ff6a1a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.6 Tajawal,Tahoma,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:#000;border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
label{display:grid;gap:4px;font-size:14px;color:var(--mut)}
label input[type=checkbox]{width:auto;margin-inline-end:6px}
header{display:flex;align-items:center;gap:12px;padding:12px 4vw;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:20px;margin:0;color:var(--gold);margin-inline-end:auto}
nav{display:flex;gap:8px;padding:12px 4vw;overflow:auto}
nav button{background:none;border:1px solid var(--line);border-radius:99px;padding:6px 18px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}
main{padding:0 4vw 60px;max-width:1000px;margin:0 auto;display:grid;gap:12px}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.r{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.r>input,.r>select{flex:1 1 140px}
.l{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 0}
.b{display:inline-block;background:var(--gold);color:#000;border:0;border-radius:8px;padding:7px 16px;font-weight:700;cursor:pointer;text-decoration:none;font-size:15px}
.b.d{background:#3a1010;color:#ff8a80}
.g{color:var(--gold)}.m{color:var(--mut)}.err{color:#ff7b72}
.th{width:56px;height:56px;border-radius:8px;object-fit:cover;background:#222;display:inline-block}
summary{cursor:pointer;color:var(--gold)}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
#login form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:12px;width:min(380px,100%)}
#t{position:fixed;bottom:20px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:#1d1708;border:1px solid var(--gold);padding:8px 18px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
#t.on{opacity:1}#t.bad{border-color:#ff7b72;background:#2a0f0f}

.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.kp>div{background:#000;border:1px solid var(--line);border-radius:10px;padding:10px}
.kp b{display:block;font-size:20px;color:var(--gold)}
.bar{height:10px;background:var(--gold);border-radius:5px;min-width:2px}
.bl{display:grid;grid-template-columns:90px 1fr 110px;gap:8px;align-items:center;font-size:14px}
.pb{background:none;border:1px solid var(--line);border-radius:99px;padding:5px 14px;cursor:pointer}
.pb.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}
#rep{display:none;background:#fff;color:#000;font-family:Tahoma,Arial,sans-serif;font-size:12px;line-height:1.5}
#rep .rh{display:flex;align-items:center;gap:14px;background:#000;color:#fff;padding:10px 14px;border-radius:8px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#rep .rh img{width:70px;height:70px;object-fit:contain}
#rep .rh h1{margin:0;font-size:22px;color:#f6b800}
#rep .rh p{margin:0}
#rep h2{font-size:14px;margin:14px 0 6px;border-right:4px solid #f6b800;padding-right:8px;break-after:avoid}
#rep table{width:100%;border-collapse:collapse;margin-bottom:6px}
#rep th{background:#000;color:#f6b800;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#rep th,#rep td{border:1px solid #999;padding:3px 6px;text-align:right}
#rep tr{break-inside:avoid}
#rep thead{display:table-header-group}
#rep .rk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
#rep .rk div{border:1px solid #000;border-radius:6px;padding:6px}
#rep .rk b{display:block;font-size:16px}
#rep .rf{margin-top:14px;border-top:2px solid #000;padding-top:6px;text-align:center;font-size:11px}
@media print{body.rp{background:#fff}body.rp #app,body.rp #login,body.rp #t{display:none!important}body.rp #rep{display:block}}
#rcw{overflow-x:auto;padding:6px 0}
#rc{background:#fff;color:#000;margin:0 auto;padding:3mm;font-size:13px;line-height:1.45;border:1px dashed #999;font-weight:700;font-family:Tahoma,Arial,sans-serif}
#rc img.ilg{display:block;margin:0 auto 2px;width:72%}
#rc .ict{text-align:center}
#rc hr{border:0;border-top:2px solid #000;margin:5px 0}
#rc hr.id{border-top:1px dashed #000}
#rc .ibx{border:2px solid #000;border-radius:8px;padding:3px 8px;text-align:center;font-size:16px;font-weight:800;margin:4px 0}
#rc .isec{font-weight:800;font-size:14px;margin-top:3px}
#rc .ir{display:flex;justify-content:space-between;gap:6px}
#rc .ith,#rc .itr{display:grid;grid-template-columns:2.3fr 1.4fr 1fr;gap:4px;padding:3px 4px}
#rc .ith{background:#000;color:#fff;font-weight:800}
#rc .itr{border-bottom:1px solid #000}
#rc .itr span:last-child,#rc .ith span:last-child{text-align:left}
#rc .itt{display:flex;justify-content:space-between;border:2px solid #000;border-radius:8px;padding:4px 8px;font-size:18px;font-weight:800;margin:5px 0}
#rc svg{width:26mm;height:26mm;display:block;margin:3px auto}
.irow{display:grid;grid-template-columns:3fr 2fr 1.3fr auto;gap:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media print{
 header,nav,#t,#login{display:none!important}
 body{background:#fff}
 main{padding:0;max-width:none;display:block}
 main>*:not(#rcw){display:none!important}
 #rcw{overflow:visible;padding:0}
 #rc{border:0;margin:0}
}
</style>
<style id="pg">@page{size:80mm auto;margin:0}</style>
</head>
<body>
<div id="login">
<form id="lf"><h1 class="g" style="margin:0">لوحة إدارة جزارة ومطعم أبوهاشم</h1>
<label>الإيميل<input id="em" type="email" autocomplete="username" required></label>
<label>كلمة السر<input id="pw" type="password" autocomplete="current-password" required></label>
<p class="err" id="le"></p>
<button class="b" type="submit">دخول</button></form>
</div>
<div id="app" hidden>
<header><h1>جزارة ومطعم أبوهاشم | الإدارة</h1><button class="b d" id="lo">خروج</button></header>
<nav id="nav"></nav>
<main id="v"></main>
</div>
<div id="t"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

const sb=supabase.createClient('https://nukvajplbogqotysuizw.supabase.co','sb_publishable_6jV5X7mAMDJZ2ZKvtwg4Lw_udf40jyv');
const $=id=>document.getElementById(id),V=$('v');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=x=>(+x).toLocaleString('en-US');
const ok=r=>{if(r.error)throw r.error;return r.data};
const ST={new:'جديد',review:'قيد المراجعة',confirmed:'تم التأكيد',preparing:'قيد التجهيز',out:'خرج للتوصيل',delivered:'تم التسليم',cancelled:'ملغي'};
const wa=(o,t)=>`https://wa.me/20${o.phone.slice(1)}?text=${encodeURIComponent(t)}`;
const w=q=>+q==.5?'نص كيلو':n(q)+' كيلو';
const feeTxt=o=>+o.delivery_fee>0?`\nالأصناف: ${o.subtotal-(o.discount||0)} ج + التوصيل: ${o.delivery_fee} ج\nالإجمالي: ${o.total} ج`:'';

const fail=e=>toast(e.message||'حدث خطأ',1);
const baseTitle=document.title;let lastSeen=null,pend=0,actx=null;

async function poll(){try{const r=await sb.from('orders').select('created_at').order('created_at',{ascending:false}).limit(1);if(r.error||!r.data)return;const top=r.data[0]&&r.data[0].created_at;if(lastSeen===null){lastSeen=top||'';return}
if(top&&(!lastSeen||new Date(top)>new Date(lastSeen))){const c=lastSeen?await sb.from('orders').select('id',{count:'exact',head:true}).gt('created_at',lastSeen):{count:1};pend+=c.count||1;lastSeen=top;document.title='('+pend+') '+baseTitle;beep();toast('وصل طلب جديد');if(cur=='orders')tab('orders')}}catch(e){}}
window.addEventListener('focus',()=>{pend=0;document.title=baseTitle});
const TABS={orders:['الطلبات',orders],prep:['التجهيز',prep],driver:['المندوب',driver],products:['المنتجات',products],customers:['العملاء',customers],coupons:['الكوبونات',coupons],reviews:['التقييمات',reviews],sales:['المبيعات',sales],invoice:['الفواتير',invoice],settings:['الإعدادات',settings]};
$('nav').innerHTML=Object.entries(TABS).map(([k,v])=>`<button data-k="${k}">${v[0]}</button>`).join('');
$('nav').onclick=e=>{const b=e.target.closest('button');if(b)tab(b.dataset.k)};
function tab(k){[...$('nav').children].forEach(b=>b.classList.toggle('on',b.dataset.k==k));V.innerHTML='<p class="m">جاري التحميل...</p>';TABS[k][1]().catch(e=>{V.innerHTML='<p class="err">'+esc(e.message)+'</p>'})}
let cur='orders';
const go=k=>{cur=k;if(k=='orders'){pend=0;document.title=baseTitle}tab(k)};
async function enter(){
  const r=await sb.from('admins').select('user_id').maybeSingle();
  if(!r.data){await sb.auth.signOut();$('le').textContent=' هذا الحساب ليس لديه صلاحية الإدارة الدخول خاص للمهندس ياسر.';$('login').hidden=false;$('app').hidden=true;return}
  $('login').hidden=true;$('app').hidden=false;go('orders');poll();if(!poll.t)poll.t=setInterval(poll,20000);
}
$('lf').onsubmit=async e=>{e.preventDefault();$('le').textContent='';
  const r=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
  if(r.error)return $('le').textContent='الإيميل أو كلمة السر غير صحيحة.';
  enter()};
$('lo').onclick=async()=>{await sb.auth.signOut();location.reload()};
sb.auth.getSession().then(({data})=>{if(data.session)enter()});

  HERO=s.hero_images||[];
  const z=(s.delivery_zones||[]).map(x=>x.name+' | '+x.fee).join('\n');
  V.innerHTML=`<div class="c" id="st">${SF.map(([k,l])=>`<label>${l}<input data-f="${k}"${k=='min_order'?' type="number" min="0"':''} value="${esc(s[k]??'')}"></label>`).join('')}
<label>مناطق التوصيل (سطر لكل منطقة: الاسم | السعر)<textarea data-f="zones" rows="4">${esc(z)}</textarea></label>
<div class="c" style="margin:0"><b class="g">مواعيد استقبال الطلبات (بتوقيت القاهرة)</b>
<div class="g2"><label>بيفتح الساعة<input data-f="open_from" type="time" value="${esc((s.open_from||'').slice(0,5))}"></label><label>بيقفل الساعة<input data-f="open_to" type="time" value="${esc((s.open_to||'').slice(0,5))}"></label></div>
<label style="display:flex;gap:8px;align-items:center"><input data-f="force_closed" type="checkbox" style="width:auto"${s.force_closed?' checked':''}> قفل المتجر دلوقتي (بيوقف استقبال الطلبات فوراً)</label>
<label>رسالة القفل (اختياري)<input data-f="closed_message" value="${esc(s.closed_message||'')}"></label>
<p class="m" style="margin:0">سيب الساعتين فاضيين لو المتجر شغّال 24 ساعة. لو بتقفل بعد نص الليل اكتب الأوقات عادي (مثلاً من 10 ص إلى 2 ص).</p></div>
<div><b>صور الهيدر</b><div class="r" id="hr"></div><label class="b">إضافة صورة<input type="file" accept="image/*" data-a="hero" hidden></label></div>
<button class="b" data-a="ss">حفظ الإعدادات</button></div>`;
  drawHero();
}

V.onclick=async e=>{
  const b=e.target.closest('[data-a]');if(!b||b.tagName=='INPUT'||b.tagName=='SELECT')return;
  const a=b.dataset.a,c=b.closest('[data-id]'),id=c&&c.dataset.id;
  try{
    if(a=='fee'){const v=+c.querySelector('[data-fee]').value;if(!(v>=0))return toast('اكتب مبلغ صحيح',1);const sub=+c.dataset.sub,dc=+c.dataset.disc||0;ok(await sb.from('orders').update({delivery_fee:v,total:sub-dc+v}).eq('id',id));toast('تم حفظ التوصيل');await orders();const d=V.querySelector('[data-id="'+id+'"] details');if(d)d.open=true}
    else if(a=='cpadd'){const o=rd($('cpn')),cd=String(o.code||'').trim().toUpperCase();if(!cd||!(o.value>0))return toast('اكتب الكود والقيمة',1);if(o.discount_type=='percent'&&o.value>100)return toast('النسبة لازم تكون 100 أو أقل',1);
      ok(await sb.from('coupons').insert({code:cd,discount_type:o.discount_type,value:o.value,min_order:o.min_order||0,max_discount:o.max_discount||null,expires_at:o.expires_at?new Date(o.expires_at+'T23:59:59').toISOString():null,is_active:true}));toast('تمت إضافة الكوبون');go('coupons')}
    else if(a=='cptg'){ok(await sb.from('coupons').update({is_active:b.dataset.v!='1'}).eq('id',id));go('coupons')}
    else if(a=='cpdel'){if(!confirm('حذف الكوبون ده؟'))return;ok(await sb.from('coupons').delete().eq('id',id));toast('تم الحذف');go('coupons')}
    else if(a=='pprep')pprep();
    else if(a=='pdrv')pdrv();
    else if(a=='dlv'){ok(await sb.from('orders').update({status:'delivered'}).eq('id',id));toast('تم التسليم');go('driver')}
    else if(a=='csend'){if(!OFT.trim())return toast('اكتب نص العرض الأول',1);window.open('https://wa.me/'+wph(b.dataset.p)+'?text='+encodeURIComponent('أهلاً '+b.dataset.n+' 👋\n'+OFT.trim()+'\n\nجزارة ومطعم أبوهاشم\n'+STORE),'_blank');SENT[b.dataset.p]=1;b.textContent='✓ اتبعت'}
    else if(a=='sxl')await sxl();
    else if(a=='srep')await srep();
    else if(a=='sp'){SP.k=b.dataset.k;go('sales')}
    else if(a=='sgo'){const f=$('sf').value,t=$('stt').value;if(!f||!t||t<f)return toast('اختار تاريخ البداية والنهاية صح',1);SP={k:'custom',f,t};go('sales')}
    else if(a=='inv'){INVO=ORD[id];go('invoice')}
    else if(a=='iparse')iparse();
    else if(a=='iadd'){IT.push({n:"",q:"",p:0});idraw()}
    else if(a=='idel'){IT.splice(+b.dataset.i,1);idraw()}
    else if(a=='iprint')window.print();
    else if(a=='iwa')iwa();
    else if(a=='add'){const o=rd($('np'));if(!o.name.trim()||o.price_per_kg==null)return toast('اكتب الاسم والسعر',1);ok(await sb.from('products').insert(o));toast('تمت الإضافة');go('products')}
    else if(a=='save'){const o=rd(c),ci=c.querySelector('[data-c]');ok(await sb.from('products').update(o).eq('id',id));if(ci)ok(await sb.from('product_costs').upsert({product_id:id,cost_per_kg:+ci.value||0}));toast('تم الحفظ')}
    else if(a=='del'){if(!confirm('حذف الصنف نهائياً؟'))return;ok(await sb.from('products').delete().eq('id',id));toast('تم الحذف');go('products')}
    else if(a=='ap'){ok(await sb.from('reviews').update({is_approved:b.dataset.v=='1'}).eq('id',id));go('reviews')}
    else if(a=='rd'){if(!confirm('حذف التقييم؟'))return;ok(await sb.from('reviews').delete().eq('id',id));go('reviews')}
    else if(a=='hrm'){HERO.splice(+b.dataset.i,1);drawHero()}
    else if(a=='ss'){
      const o=rd($('st')),z=(o.zones||'').split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(x=>x[0]).map(x=>({name:x[0],fee:+x[1]||0}));
      delete o.zones;for(const k in o)if(o[k]==='')o[k]=null;
      o.min_order=o.min_order||0;o.delivery_zones=z;o.hero_images=HERO;
      ok(await sb.from('store_settings').update(o).eq('id',1));toast('تم حفظ الإعدادات');
    }
  }catch(x){fail(x)}
};
V.onchange=async e=>{
  const el=e.target,a=el.dataset.a,c=el.closest('[data-id]');
  try{
    if(a=='st'){ok(await sb.from('orders').update({status:el.value}).eq('id',c.dataset.id));toast('تم تحديث الحالة');go('orders')}
    else if(a=='img'&&el.files[0]){toast('جاري رفع الصورة...');const u=await up(el.files[0]);ok(await sb.from('products').update({image_url:u}).eq('id',c.dataset.id));toast('تم رفع الصورة');go('products')}
    else if(a=='hero'&&el.files[0]){toast('جاري رفع الصورة...');HERO.push(await up(el.files[0]));drawHero();toast('اضغط حفظ الإعدادات لتثبيت الصورة')}
  }catch(x){fail(x)}
};
</script>
</body>
</html>
